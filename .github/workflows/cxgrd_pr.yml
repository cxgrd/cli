name: CXGRD Check
on: [pull_request]

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci  

      - uses: actions/cache@v4
        with:
          path: .cg/
          key: cxgrd-graph-${{ hashFiles('package-lock.json') }}

      - run: npm install -g cxgrd@latest

      - run: cxgrd scan

      - name: CXGRD Check
        id: cxgrd
        run: cxgrd check --json > result.json

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('result.json', 'utf8'));

            const body = `## CXGRD Blast Radius\n # Here is the summary of the blast radius analysis:\nRisk: ${result.blastResult.riskLevel}\nAffected files: ${result.blastResult.affectedFiles.map(f => f.path).join(', ')}`;

            const marker = '<!-- cxgrd-check -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: `${marker}\n${body}` });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `${marker}\n${body}` });
            }