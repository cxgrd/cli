name: CXGRD Check
on: [pull_request]

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g cxgrd
      - id: cxgrd
        run: echo "result=$(cxgrd check --json)" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.cxgrd.outputs.result }}`);
            const body = `## CXGRD Blast Radius\n\nRisk: ${result.risk}\nAffected files: ${result.affectedFiles.join(', ')}`;

            // upsert: find existing comment first
            const marker = '<!-- cxgrd-check -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n${body}`,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${marker}\n${body}`,
              });
            }